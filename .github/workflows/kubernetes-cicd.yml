
name: Breast Cancer Kubernetes CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/akhila-55/breast-cancer-ml

jobs:
  build-and-push:
    name: Build, Test and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set image tag
        run: echo "IMAGE_TAG=sha-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:$IMAGE_TAG .

      - name: Start application container
        run: |
          docker run -d --name breast-cancer-test \
            -p 5000:5000 $IMAGE_NAME:$IMAGE_TAG

      - name: Health check
        run: |
          for i in {1..15}; do
            if curl -fsS http://localhost:5000/; then
              exit 0
            fi
            sleep 2
          done
          docker logs breast-cancer-test
          exit 1

      - name: Test prediction endpoint
        run: python test_api.py

      - name: Login to GitHub Container Registry
  	run: |
    	  echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:$IMAGE_TAG
          docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:latest
          docker push $IMAGE_NAME:latest

      - name: Stop test container
        if: always()
        run: docker rm -f breast-cancer-test || true

  deploy:
    name: Deploy to Minikube
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Verify Kubernetes cluster
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Update Kubernetes deployment
        shell: powershell
        run: |
          $image = "ghcr.io/akhila-55/breast-cancer-ml:sha-${{ github.sha }}"
          kubectl set image deployment/breast-cancer-deployment breast-cancer-container=$image
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Wait for rollout
        shell: powershell
        run: |
          kubectl rollout status deployment/breast-cancer-deployment --timeout=180s
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Verify deployment
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services

      - name: Roll back if deployment fails
        if: failure()
        shell: powershell
        run: |
          kubectl rollout undo deployment/breast-cancer-deployment
          kubectl rollout status deployment/breast-cancer-deployment --timeout=180s
